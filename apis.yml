aid: kensho
name: Kensho
description: >-
  Kensho Technologies is the AI innovation hub of S&P Global, building machine
  learning and AI systems that structure, connect, and extract meaning from the
  world's financial and business data. Kensho's developer platform exposes a
  suite of production APIs: Scribe for speech-to-text transcription of audio and
  video, Extract for turning PDF documents into structured JSON, NERD for
  named-entity recognition and disambiguation against Wikimedia and S&P Capital
  IQ knowledge bases, and the LLM-ready API (kfinance) that connects LLMs,
  agents, and AI applications to S&P Global's trusted data through Adaptive
  Retrieval and a hosted, OAuth-secured Model Context Protocol (MCP) server.
  Authentication is bearer-token based, issued from Kensho's services platform
  via personal tokens or production key pairs, with OAuth 2.0 (authorization
  code, client credentials, and refresh token flows, PKCE, and dynamic client
  registration) for the MCP surface.
