apis:
- name: Kensho Scribe
  description: >-
    Asynchronous speech-to-text transcription API that turns audio and video
    into text with high accuracy. Supports batch, real-time, and
    human-in-the-loop transcription, multipart and remote-URL submission, HEAD
    polling for completion, and webhook callbacks.
  humanURL: https://docs.kensho.com/scribe/v2/developer-guide
  baseURL: https://scribe.kensho.com
  tags:
  - Speech-to-Text
  - Transcription
  - Audio
  tags_raw:
  - Speech to Text
  - Transcription
  - Audio
  properties:
  - type: Documentation
    url: https://docs.kensho.com/scribe/v2/developer-guide
  - type: APIReference
    url: https://docs.kensho.com/scribe/v2/batch-api-specification
- name: Kensho Extract
  description: >-
    Document intelligence API that transforms PDF documents into structured
    JSON, with hierarchical extraction, optical character recognition (OCR),
    enhanced table extraction, and bounding-box locations. Supports both direct
    upload and a presigned upload/download URL flow for large documents.
  humanURL: https://docs.kensho.com/extract/home
  baseURL: https://extract.kensho.com
  tags:
  - Document Extraction
  - PDF
  - OCR
  properties:
  - type: Documentation
    url: https://docs.kensho.com/extract/home
  - type: APIReference
    url: https://docs.kensho.com/extract/api
- name: Kensho NERD
  description: >-
    Named Entity Recognition and Disambiguation API that identifies and links
    concepts in text to knowledge bases (Wikimedia for general entities, S&P
    Capital IQ for financial organizations and people), returning entity
    positions, IDs, types, and confidence scores (ner_score and ned_score).
  humanURL: https://docs.kensho.com/nerd/overview
  baseURL: https://nerd.kensho.com
  tags:
  - Named Entity Recognition
  - Entity Linking
  - NLP
  properties:
  - type: Documentation
    url: https://docs.kensho.com/nerd/overview
  - type: APIReference
    url: https://docs.kensho.com/nerd/api
- name: Kensho LLM-ready API (kfinance)
  description: >-
    LLM-ready API that connects LLMs, agents, and AI applications to S&P
    Global's trusted data through flexible retrieval, Adaptive Retrieval data
    agents, a Python library (kensho-kfinance), and a hosted, OAuth-secured
    Model Context Protocol (MCP) server.
  humanURL: https://docs.kensho.com/llmreadyapi/overview
  baseURL: https://kfinance.kensho.com
  tags:
  - LLM
  - Retrieval
  - MCP
  - Financial Data
  tags_raw:
  - LLM
  - Retrieval
  - Model Context Protocol
  - Financial Data
  properties:
